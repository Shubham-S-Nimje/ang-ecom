<div
  class="container mx-auto min-h-screen flex items-center justify-start gap-4 flex-wrap"
>
  <button
    *ngFor="let category of categories"
    class="bg-white shadow rounded-md px-2 py-1 transition delay-100 duration-100 ease-in-out hover:-translate-y-1 hover:scale-110"
  >
    <a
      [routerLink]="['/category', category?.categoryId]"
      class="truncate capitalize"
      >{{ category?.categoryName }}</a
    >
  </button>
</div>
